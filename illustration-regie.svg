<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<title id="title">AutoDirector, de la voix au changement de plan</title>
<desc id="desc">Illustration de régie multicaméra. Le plan large est au programme, un plan PTZ est en prévisualisation et l’opérateur valide la coupe.</desc>
<defs>
  <linearGradient id="bg" x1="0" x2="1" y2="1">
    <stop stop-color="#202c40"/><stop offset="1" stop-color="#101621"/>
  </linearGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#1d2b3e"/></pattern>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path fill="#78d9d4" d="M0 0L8 4L0 8z"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="680" rx="25" fill="url(#bg)" stroke="none"/>
<g font-family="system-ui, -apple-system, Segoe UI, sans-serif"><circle cx="49" cy="51" r="7" fill="#78d9d4"/><text x="65" y="59" fill="#f5f8fc" font-size="30" font-weight="750" text-anchor="start" letter-spacing="0">AutoDirector</text><text x="44" y="95" fill="#b8c4d5" font-size="18" font-weight="500" text-anchor="start" letter-spacing="0">Réalisation multicaméra assistée</text><rect x="887" y="37" width="190" height="28" rx="14" fill="#30415c" stroke="none"/><text x="982" y="56" fill="#eff5ff" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0">ILLUSTRATION DE RÉGIE</text><rect x="44" y="116" width="500" height="326" rx="17" fill="#131b29" stroke="#3c4b65"/><circle cx="67" cy="143" r="5" fill="#ffa2ad"/><text x="79" y="149" fill="#ffa2ad" font-size="14" font-weight="750" text-anchor="start" letter-spacing="1.1">PROGRAM</text><rect x="59" y="166" width="470" height="203" rx="10" fill="#17253a" stroke="#2f405b"/><path d="M69 327H519" stroke="#344860" stroke-width="2"/><rect x="150" y="307" width="286" height="41" rx="9" fill="#263651" stroke="none"/><g transform="translate(170 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(205 277) scale(0.78)"><circle cy="-13" r="10" fill="#6dcdd1"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#6dcdd1"/></g><g transform="translate(240 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(275 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(310 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(345 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(380 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><g transform="translate(415 277) scale(0.78)"><circle cy="-13" r="10" fill="#7186a5"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#7186a5"/></g><path d="M74 191h23m-23 0v23m440-23h-23m23 0v23m-440 127h23m-23 0v-23m440 23h-23m23 0v-23" fill="none" stroke="#6882a5" stroke-width="2"/><text x="65" y="400" fill="#f0f4fa" font-size="22" font-weight="740" text-anchor="start" letter-spacing="0">Plan large</text><text x="65" y="424" fill="#b8c4d5" font-size="14" font-weight="500" text-anchor="start" letter-spacing="0">Caméra fixe  ·  table ronde</text><rect x="576" y="116" width="500" height="326" rx="17" fill="#131b29" stroke="#3c4b65"/><circle cx="599" cy="143" r="5" fill="#86e6ac"/><text x="611" y="149" fill="#86e6ac" font-size="14" font-weight="750" text-anchor="start" letter-spacing="1.1">PREVIEW</text><rect x="591" y="166" width="470" height="203" rx="10" fill="#17253a" stroke="#2f405b"/><path d="M604 330H1051" stroke="#3e5872" stroke-width="2"/><g transform="translate(826 263) scale(2.25)"><circle cy="-13" r="10" fill="#76d7d3"/><path d="M-18 12c0-14 36-14 36 0V23h-36z" fill="#76d7d3"/></g><rect x="735" y="302" width="182" height="44" rx="10" fill="#2c425c" stroke="none"/><path d="M614 190h25m-25 0v24m430-24h-25m25 0v24m-430 127h25m-25 0v-24m430 24h-25m25 0v-24" fill="none" stroke="#76d7d3" stroke-width="2"/><text x="597" y="400" fill="#f0f4fa" font-size="22" font-weight="740" text-anchor="start" letter-spacing="0">Intervenant B</text><text x="597" y="424" fill="#b8c4d5" font-size="14" font-weight="500" text-anchor="start" letter-spacing="0">PTZ 2  ·  plan moyen</text><text x="44" y="475" fill="#e5edf8" font-size="17" font-weight="700" text-anchor="start" letter-spacing="0">Mode semi-automatique</text><rect x="44" y="492" width="316" height="107" rx="12" fill="#162134" stroke="#4a5c77"/><circle cx="71" cy="519" r="13" fill="#2b4d60"/><text x="